<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>静档验证码</title></head>

  <h2>你的静档验证码</h2>
  <p>请在应用中输入：</p>
  <p style="font-size: 28px; letter-spacing: 6px">{{ .Token }}</p>

</body></html>
