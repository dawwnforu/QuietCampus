name: Verify private archive
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.6'
      - run: deno test --node-modules-dir=none --allow-env=SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY --lock=supabase/functions/deno.lock supabase/functions/delete-account/index_test.ts
  flutter:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - if: runner.os == 'Linux'
        run: |
          npm ci
          dart compile js -O1 -DEMIT_CRYPTO_FIXTURE=true -o build/crypto-check.js tool/crypto_self_check.dart
          node tool/check-crypto-js.mjs build/crypto-check.js
      - if: runner.os == 'Windows'
        run: flutter build windows --debug
      - if: runner.os == 'macOS'
        run: flutter build ios --simulator --no-codesign
      - if: runner.os == 'Linux'
        run: flutter build apk --debug
