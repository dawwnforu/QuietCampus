name: quiet_campus
description: 静档——属于大学生自己的加密成长档案。
publish_to: none
version: 0.2.5+7
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: 11.6.0
  pdfrx: 2.9.0
  sodium: 4.1.2
  sqlite3: 3.7.1
  flutter_secure_storage: 11.2.0
  supabase_flutter: 2.18.3
  file_picker: 13.1.0
  file_picker_web: 4.2.0
  flutter_local_notifications: 22.3.2
  flutter_timezone: 5.1.1
  timezone: 0.11.2
  path_provider: 2.1.6
  path: 1.9.1
  uuid: 4.6.0
  table_calendar: 3.3.0
  characters: 1.4.1
  web: 1.1.1
  unorm_dart: 0.3.3
  open_filex: 5.0.0
  record: 7.1.2
  audioplayers: 6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: 1.31.1
  flutter_lints: 6.0.0
  msix: 3.16.12
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC-LICENSE.txt
    - assets/fonts/LXGWWenKaiLite-LICENSE.txt
    - assets/licenses/pdfium/
    - assets/licenses/pdfium/licenses/
    - assets/samples/quiet-campus-sample.pdf
  fonts:
    - family: QuietSans
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
    - family: QuietDisplay
      fonts:
        - asset: assets/fonts/LXGWWenKaiLite-Regular.ttf
msix_config:
  display_name: 静档
  publisher_display_name: Quiet Campus
  identity_name: cn.quietcampus.quiet_campus
  publisher: CN=QuietCampus
  msix_version: 0.2.5.0
  capabilities: internetClient,microphone
